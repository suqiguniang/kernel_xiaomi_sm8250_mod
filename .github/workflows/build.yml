name: Build Kernel (munch)

# munch = Redmi K40S / POCO F4 — the only build target of this fork.
on:
  workflow_dispatch:
    inputs:
      ksu:
        description: 'Enable KernelSU (ReSukiSU)'
        required: true
        type: boolean
        default: true
      target_os:
        description: 'Target OS (目标系统)'
        required: true
        type: choice
        default: 'both'
        options:
          - aosp
          - miui
          - both

# Needed to create the GitHub release from this workflow.
permissions:
  contents: write

env:
  DEVICE: munch
  # ReSukiSU manager APK that matches the KernelSU pin in build_kernel.sh.
  # The kernel reports version 35089 with UAPI 2; the manager must use the same
  # UAPI or it shows "Kernel update required" (rc2/rc3 are on UAPI 4).
  KSU_MANAGER_TAG: v4.2.0-rc1
  KSU_MANAGER_APKS: >-
    ReSukiSU_v4.2.0-rc1_35061-arm64-v8a-release.apk
    ReSukiSU_v4.2.0-rc1_35061-universal-release.apk

jobs:
  build-kernel:
    name: Build munch | KSU:${{ github.event.inputs.ksu }} | OS:${{ github.event.inputs.target_os }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Set up Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex gawk \
          git gnupg gperf imagemagick libncurses-dev \
          lib32readline-dev lib32z1-dev liblz4-tool \
          libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
          schedtool squashfs-tools xsltproc zip zlib1g-dev python3

    - name: Cache ccache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ccache_mikernel
        key: ${{ runner.os }}-kernel-ccache-munch-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-kernel-ccache-munch-
          ${{ runner.os }}-kernel-ccache-

    - name: Setup zyc-clang 16 Toolchain
      run: |
        mkdir -p $HOME/zyc-clang
        cd $HOME/zyc-clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260510-release/Clang-16.0.6-20260510.tar.gz
        tar -zxvf Clang-16.0.6-20260510.tar.gz

    - name: Run Build Script
      run: |
        chmod +x build_kernel.sh

        ARGS="${DEVICE}"

        if [ "${{ github.event.inputs.ksu }}" == "true" ]; then
          ARGS="$ARGS ksu"
        fi

        if [ "${{ github.event.inputs.target_os }}" != "both" ]; then
          ARGS="$ARGS ${{ github.event.inputs.target_os }}"
        fi

        echo "Executing command: ./build_kernel.sh $ARGS"
        ./build_kernel.sh $ARGS

    - name: Verify DroidSpaces kernel configs
      run: |
        status=0
        for cfg in out_aosp/.config out_miui/.config; do
          [ -f "$cfg" ] || continue
          echo "== Verifying DroidSpaces options in $cfg"
          while read -r line; do
            case "$line" in
              CONFIG_*=y)
                grep -qx -- "$line" "$cfg" || { echo "MISSING: $line"; status=1; }
                ;;
            esac
          done < arch/arm64/configs/vendor/xiaomi/droidspaces.config
        done
        if [ "$status" -ne 0 ]; then
          echo "FAILED: the built configuration does not contain all DroidSpaces options"
          exit 1
        fi
        echo "OK: all DroidSpaces options are enabled in the built configuration"
        # Note: the config embedded in the Image (IKCONFIG / /proc/config.gz) is a
        # stock Xiaomi defconfig on this tree by design, so it is not the build
        # configuration and cannot be used for verification.
        for img in out_aosp/arch/arm64/boot/Image out_miui/arch/arm64/boot/Image; do
          [ -f "$img" ] || continue
          n=$(scripts/extract-ikconfig "$img" 2>/dev/null | wc -l || echo 0)
          echo "note: $img reports $n lines of stock config via IKCONFIG (by design)"
        done

    - name: Verify flashable ZIP contents
      run: |
        # The AnyKernel3 kona anykernel.sh must point at the kernel this build
        # staged; if it does not, flashing silently keeps the OLD kernel.
        status=0
        for z in APTKernel_*.zip; do
          [ -f "$z" ] || continue
          echo "== Inspecting $z"
          if ! unzip -l "$z" | grep -qE 'kernels/[a-z]+/Image'; then
            echo "ERROR: $z does not contain kernels/<os>/Image"
            status=1
          fi
          if unzip -p "$z" anykernel.sh | grep -qE 'mv \$home/kernels/Image'; then
            echo "ERROR: $z anykernel.sh still reads kernels/Image (would flash the old kernel)"
            status=1
          fi
          unzip -p "$z" anykernel.sh | grep -E 'mv \$home/kernels/' || true
          # confirm the staged Image matches the freshly built one
          os=$(unzip -p "$z" anykernel.sh | sed -nE 's#.*kernels/([a-z]+)/Image.*#\1#p' | head -1)
          [ -n "$os" ] || { echo "ERROR: could not determine OS variant in $z"; status=1; continue; }
          rm -rf /tmp/zipchk && mkdir -p /tmp/zipchk
          unzip -o -q "$z" "kernels/$os/Image" -d /tmp/zipchk
          if ! cmp -s "/tmp/zipchk/kernels/$os/Image" "out_$os/arch/arm64/boot/Image"; then
            echo "ERROR: $z contains a kernel that does not match out_$os/arch/arm64/boot/Image"
            status=1
          else
            echo "OK: $z kernel matches the freshly built out_$os Image"
          fi
        done
        [ "$status" -eq 0 ] || { echo "FAILED: flashable zip contents are wrong"; exit 1; }
        echo "OK: flashable zips carry the freshly built kernel"

    - name: Upload Flashable ZIP
      uses: actions/upload-artifact@v7
      with:
        name: APTKernel-munch-${{ github.event.inputs.target_os }}-${{ github.run_id }}
        path: APTKernel_*.zip
        compression-level: 0 # 已经被 zip 压缩过，无需再二次压缩

    - name: Upload build configs
      uses: actions/upload-artifact@v7
      with:
        name: kernel-config-munch-${{ github.run_id }}
        path: |
          out_aosp/.config
          out_miui/.config

    - name: Fetch matching ReSukiSU manager APK
      run: |
        mkdir -p apk
        for f in $KSU_MANAGER_APKS; do
          echo "[*] Downloading $f"
          curl -fL --retry 5 --retry-all-errors -o "apk/$f" \
            "https://github.com/Baka-SU/BakaSU/releases/download/${KSU_MANAGER_TAG}/$f"
        done
        # an APK is a zip; make sure we did not save an error page
        for f in apk/*.apk; do
          unzip -l "$f" | grep -q AndroidManifest.xml || {
            echo "ERROR: $f is not a valid APK"; exit 1; }
          echo "OK: $f ($(stat -c %s "$f") bytes)"
        done

    - name: Publish release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        tag="munch-$(date -u +'%Y%m%d-%H%M%S')"
        cat > release-notes.md <<'EOF'
        ## munch — Redmi K40S / POCO F4

        Flash the AnyKernel3 zip that matches your ROM (do NOT flash dtbo.img):

        - `APTKernel_AOSP_*` → AOSP-based ROMs (LineageOS, crDroid, PixelOS, ...)
        - `APTKernel_MIUI_*` → MIUI / HyperOS

        ### ReSukiSU manager app (included)
        The APKs attached to this release match the KernelSU driver in this
        build (`ReSukiSU_v4.2.0-rc1_35061`). Install the **arm64-v8a** one; the
        universal one is a fallback. Other manager versions (rc2/rc3) use a
        different kernel UAPI and will show "Kernel update required".

        ### DroidSpaces support
        This build includes full [DroidSpaces](https://github.com/ravindu644/Droidspaces-OSS)
        kernel support (Linux container runtime): PID/UTS/IPC/NET namespaces, cgroup controllers
        with memory/CPU/PID limits, seccomp filter, devtmpfs, overlayfs, iptables/nftables NAT
        (IPv4 + IPv6), macvlan and user namespaces. CI verifies every required option against the
        built configuration and checks that each flashable zip carries the freshly built kernel.

        Install the DroidSpaces app, then run `su -c droidspaces check` to confirm.

        ### Notes
        - SuSFS: disable "HIDE SUS MOUNTS FOR ALL PROCESSES" or containers will not boot.
        - Keep your stock / ROM dtbo; this zip does not touch it.
        EOF
        gh release create "$tag" \
          --title "munch (Redmi K40S) — $tag" \
          --notes-file release-notes.md \
          APTKernel_*.zip apk/*.apk
